# Render Blueprint — MOTORE VIDEO di VcriptoV (crea i reel).
# Sostituisce il vecchio progetto: stesso servizio, stesso indirizzo, ma ora fa
# SOLO i video per VcriptoV e tiene sveglia VcriptoV con l'auto-ping.
services:
  - type: web
    name: agentcolony            # NON cambiare il nome: mantiene lo stesso indirizzo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn worker_app:app --timeout 150 --workers 1 --threads 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    autoDeploy: true             # d'ora in poi un push aggiorna il motore da solo
    envVars:
      - key: REEL_WORKER_SECRET
        sync: false              # opzionale: password uguale a quella su VcriptoV
      # tiene sveglia VcriptoV (come prima) così i segnali non si fermano mai
      - key: MUTUAL_PING_URLS
        value: https://vcriptov.onrender.com
