# Render Blueprint — deploy di AgentColony come servizio web.
# Istruzioni complete: vedi GUIDA-24-7.md → sezione "Deploy su Render".
#
# QUI: piano GRATIS (€0), adatto alla DEMO h24.
#  - Il free si spegne dopo ~15 min di inattività, MA il bot si tiene sveglio da
#    solo (auto-ping sul proprio indirizzo pubblico) → resta acceso.
#  - Il free NON ha disco persistente: la memoria non sta su Render, il bot salva
#    da solo lo stato su GitHub (variabili STATE_GITHUB_* qui sotto).
#  - AGENTCOLONY_TOKEN è la PASSWORD del sito (obbligatoria: online è pubblico).
#  - Per "sempre acceso + disco" (consigliato per i SOLDI VERI) vedi le note in fondo.

services:
  - type: web
    name: agentcolony
    runtime: python
    plan: free                  # gratis. Per la versione a pagamento vedi le note in fondo.
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py --host 0.0.0.0
    healthCheckPath: /
    autoDeploy: false           # un push non riavvia il bot senza il tuo ok
    envVars:
      - key: AGENTCOLONY_TOKEN
        sync: false             # ← IMPOSTALA nel dashboard: password del sito (OBBLIGATORIA)
      # --- il bot si salva da solo su GitHub (così non perde lo stato ai riavvii) ---
      - key: STATE_GITHUB_REPO
        value: l13291221-cmyk/IA-
      - key: STATE_GITHUB_TOKEN
        sync: false             # ← token GitHub "fine-grained": solo questo repo, Contents R/W
      # --- solo per i SOLDI VERI (chiavi SOLO-TRADING, niente prelievi) ---
      - key: KRAKEN_API_KEY
        sync: false
      - key: KRAKEN_API_SECRET
        sync: false

# ─────────────────────────────────────────────────────────────────────────────
# VUOI "SEMPRE ACCESO" SUL SERIO (consigliato quando passi ai SOLDI VERI)?
# 1) cambia   plan: free   →   plan: starter
# 2) aggiungi in fondo al servizio (stessa indentazione di envVars):
#        disk:
#          name: agentcolony-data
#          mountPath: /var/data
#          sizeGB: 1
# 3) aggiungi tra le envVars:
#        - key: AGENTCOLONY_DATA_DIR
#          value: /var/data
# Così niente spegnimento e stato salvato sul disco, senza dipendere da GitHub.
